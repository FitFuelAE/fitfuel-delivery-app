<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<meta name="robots" content="noindex" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FF Admin" />
<link rel="manifest" href="./warehouse.webmanifest" />
<link rel="apple-touch-icon" href="/icon-512.png" />
<title>FitFuel Delivery — Warehouse</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { --green:#111111; --green-d:#000000; --bg:#f5f6f8; --card:#fff; --line:#e5e7eb; --muted:#6b7280; --red:#dc2626; --amber:#d97706; }
  html,body { margin:0; padding:0; background:var(--bg); color:#111827;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { padding-bottom: env(safe-area-inset-bottom); }
  header { position:sticky; top:0; z-index:10; background:var(--green); color:#fff;
    padding:calc(env(safe-area-inset-top) + 14px) 16px 14px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:18px; margin:0; font-weight:700; }
  header .sub { font-size:12px; opacity:.85; margin-top:2px; }
  header button { background:rgba(255,255,255,.2); color:#fff; border:none; border-radius:8px;
    padding:8px 12px; font-size:14px; font-weight:600; }
  .wrap { padding:16px; max-width:760px; margin:0 auto; }

  /* Login */
  .login { min-height:100dvh; display:flex; flex-direction:column; justify-content:center; padding:24px; max-width:420px; margin:0 auto; }
  .login h2 { text-align:center; margin:0 0 6px; }
  .login p.tag { text-align:center; color:var(--muted); margin:0 0 24px; font-size:14px; }
  label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin:14px 0 6px; }
  input, select { width:100%; padding:14px; font-size:17px; border:1px solid var(--line); border-radius:12px; background:#fff; }
  input:focus, select:focus { outline:none; border-color:var(--green); }
  .btn { width:100%; padding:16px; font-size:17px; font-weight:700; border:none; border-radius:12px;
    background:var(--green); color:#fff; margin-top:20px; }
  .btn:active { background:var(--green-d); }
  .btn[disabled] { opacity:.6; }
  .btn.ghost { background:#fff; color:#374151; border:1px solid var(--line); }
  .btn.danger { background:#fff; color:var(--red); border:1px solid var(--line); }
  .btn.sm { width:auto; padding:8px 12px; font-size:13px; margin-top:0; border-radius:9px; }

  /* Tabs */
  .tabs { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 16px; }
  .tabs button { flex:1 1 auto; min-width:84px; padding:10px 8px; border:1px solid var(--line); background:#fff; border-radius:10px;
    font-size:14px; font-weight:600; color:#374151; white-space:nowrap; }
  .tabs button.on { background:var(--green); color:#fff; border-color:var(--green); }

  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; }
  .card h3 { margin:0 0 4px; font-size:16px; }
  .card .hint { color:var(--muted); font-size:13px; margin:0 0 6px; }
  .row2 { display:flex; gap:10px; flex-wrap:wrap; }
  .row2 > div { flex:1; min-width:120px; }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); }
  td.actions { white-space:nowrap; display:flex; gap:6px; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; }
  .pill.on { background:#e5e7eb; color:#111827; }
  .pill.off { background:#fee2e2; color:var(--red); }
  .pill.status { background:#f3f4f6; color:#374151; }
  .pill.master { background:#111111; color:#ffffff; }

  /* Order cards (mirror the driver app) */
  .ocard { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; }
  .ocard .otop { display:flex; justify-content:space-between; align-items:baseline; }
  .ocard .onum { font-size:18px; font-weight:800; }
  .ocard .ototal { font-size:14px; color:var(--muted); }
  .ocard .owho { font-size:15px; font-weight:600; margin-top:6px; }
  .ocard a.orow { display:flex; gap:8px; align-items:center; text-decoration:none; color:#1d4ed8; font-size:15px; margin-top:8px; word-break:break-word; }
  .ocard .oitems { margin:12px 0 0; padding:12px 0 0; border-top:1px dashed var(--line); font-size:14px; color:#374151; }
  .ocard .oitems div { display:flex; justify-content:space-between; padding:2px 0; }
  .ocard .onote { margin-top:10px; font-size:13px; color:var(--amber); background:#fffbeb; padding:8px 10px; border-radius:8px; }
  .oactions { display:flex; gap:10px; margin-top:14px; }
  .oactions .btn { margin-top:0; flex:1; }
  .oissues { margin-top:12px; display:none; }
  .oissues.open { display:block; }
  .oissues .opt { display:flex; gap:8px; }
  .oissues .opt button { flex:1; padding:12px; border-radius:10px; border:1px solid var(--line); background:#fff; font-size:14px; font-weight:600; }
  .oissues textarea { width:100%; margin-top:8px; border:1px solid var(--line); border-radius:10px; padding:10px; font-size:15px; min-height:54px; }
  /* Fulfil panel (proof photo + COD cash) */
  .ofulfil { margin-top:12px; display:none; }
  .ofulfil.open { display:block; }
  .ofulfil label.fl { display:block; font-size:13px; font-weight:600; color:var(--muted); margin:6px 0; }
  .ofulfil input[type=file] { width:100%; font-size:14px; }
  .ofulfil .preview { display:none; width:100%; max-height:220px; object-fit:cover; border-radius:12px; margin-top:10px; border:1px solid var(--line); }
  .ofulfil .cash { margin-top:12px; background:#f3f4f6; border:1px solid #e5e7eb; border-radius:12px; padding:10px 12px; }
  .ofulfil .cash label { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:600; color:var(--green-d); }
  .ofulfil .cash input[type=number] { width:100%; margin-top:8px; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:10px; }
  .ofulfil .confirm { margin-top:12px; }
  .geo { font-size:12px; color:var(--muted); margin-top:8px; }
  .geo.off { color:var(--amber); }
  /* Summary */
  .sumhead { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .sumhead input[type=date] { padding:10px; border:1px solid var(--line); border-radius:10px; font-size:15px; }
  .drvcard .drvtop { display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .drvcard .drvtop .nm { font-size:16px; font-weight:800; }
  .drvcard .stat { font-size:13px; color:var(--muted); }
  .drvcard .stat b { color:#111827; }
  .drvcard .cashbig { color:var(--green-d); font-weight:800; }
  .deliv { display:flex; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
  .deliv img { width:54px; height:54px; object-fit:cover; border-radius:8px; border:1px solid var(--line); background:#f3f4f6; }
  .deliv .meta { flex:1; font-size:13px; }
  .deliv .meta .ttl { font-weight:600; }
  .fade { opacity:.4; pointer-events:none; }

  /* Collapsible driver groups (Fulfillment tab) */
  details.grp { margin-bottom:10px; }
  details.grp > summary { list-style:none; cursor:pointer; padding:13px 14px; border-radius:12px;
    border:1px solid #bbf7d0; background:#f0fdf4; font-weight:700; font-size:15px;
    display:flex; align-items:center; gap:8px; user-select:none; }
  details.grp > summary::-webkit-details-marker { display:none; }
  details.grp > summary::after { content:"›"; margin-left:auto; font-size:20px; color:var(--muted);
    transition:transform .15s ease; transform:rotate(90deg); }
  details.grp[open] > summary::after { transform:rotate(-90deg); }
  details.grp[open] > summary { margin-bottom:10px; }
  details.grp > summary .cnt { font-weight:600; color:var(--muted); font-size:13px; }
  details.grp.warn > summary { background:#fffbeb; border-color:#fde68a; }

  /* People & rights matrix */
  details.pcard > summary { list-style:none; cursor:pointer; display:flex; justify-content:space-between;
    gap:10px; align-items:baseline; flex-wrap:wrap; user-select:none; }
  details.pcard > summary::-webkit-details-marker { display:none; }
  details.pcard[open] > summary { margin-bottom:10px; }
  .caprow { display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 0; border-bottom:1px dashed var(--line); flex-wrap:wrap; }
  .caprow:last-child { border-bottom:none; }
  .capname { font-size:14px; }
  .levels { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .levels .lvl { border:none; background:#fff; padding:8px 12px; font-size:13px; font-weight:600;
    color:#374151; border-left:1px solid var(--line); }
  .levels .lvl:first-child { border-left:none; }
  .levels .lvl.on { background:var(--green); color:#fff; }

  .empty, .loading { text-align:center; color:var(--muted); padding:40px 16px; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:24px; background:#111827; color:#fff;
    padding:12px 18px; border-radius:999px; font-size:14px; z-index:50; opacity:0; transition:opacity .2s; max-width:90%; text-align:center; }
  .toast.show { opacity:1; }
  .err { color:var(--red); font-size:14px; text-align:center; margin-top:12px; min-height:18px; }
  .scroll { overflow-x:auto; }
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast"></div>

<script>
const API = "https://febchdwrgrwlfwisnnzi.supabase.co/functions/v1/api";
const APP_VERSION = "2026-09-13.3";
const root = document.getElementById("root");
let TOKEN = localStorage.getItem("ff_admin_token") || "";
let NAME = localStorage.getItem("ff_admin_name") || "";
let ME = localStorage.getItem("ff_admin_user") || "";
let ME_MASTER = localStorage.getItem("ff_admin_master") === "1";
let ME_CAPS = [], ME_RIGHTS = {};
try { ME_CAPS = JSON.parse(localStorage.getItem("ff_admin_caps") || "[]"); } catch {}
try { ME_RIGHTS = JSON.parse(localStorage.getItem("ff_admin_rights") || "{}"); } catch {}
let TAB = "allocate";   // land on step 1 of the workflow
let DRIVERS = [], ADMINS = [];   // last-loaded lists, for the Edit dialogs

// The wh copy of this file is byte-identical JS; branding comes from the path.
const IS_WH_APP = location.pathname.includes("/wh/");

// ---- rights (server-enforced; this only keeps never-working controls off screen) ----
// read = look only · write = the everyday work · edit = also undo what happened.
const RANK = { read: 1, write: 2, edit: 3 };
const hasCap = (cap) => ME_CAPS.includes(cap);
const rightAtLeast = (cap, level) => {
  const have = ME_RIGHTS[cap];
  return !!have && RANK[have] >= RANK[level || "write"];
};
let CARRIERS = [], CARRIERS_LOADED = false;   // 3PL couriers (allocation targets with no logins)

async function ensureCarriers(){
  if(CARRIERS_LOADED) return;
  try{ const r=await api("/admin/carriers"); CARRIERS=(r.carriers||[]).filter(c=>c.active); }catch{ CARRIERS=[]; }
  CARRIERS_LOADED=true;
}
function carrierName(code){ const c=CARRIERS.find(x=>x.code===code); return c?c.name:String(code||"").toUpperCase(); }
function isCarrierAssignee(a){ return !!a && a.startsWith("carrier:"); }
// "carrier:tfm" -> "🚛 TFM Express"; "raj" -> "🚚 raj" (pills + group headers).
function assigneeLabel(a){ return isCarrierAssignee(a) ? "🚛 "+carrierName(a.slice(8)) : "🚚 "+a; }
// Summary/Activity rows log the bare carrier code as the actor (e.g. "tfm").
function displayActor(u){ const c=CARRIERS.find(x=>x.code===u); return c ? "🚛 "+c.name : u; }

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2400);
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function fmtTime(iso){ if(!iso) return ""; const d=new Date(iso); return isNaN(d)? esc(iso) : d.toLocaleString(); }

async function api(path, opts={}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { "Content-Type":"application/json", ...(TOKEN?{Authorization:"Bearer "+TOKEN}:{}), ...(opts.headers||{}) },
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (res.status === 401 && TOKEN) { logout(); throw new Error("Session expired — please log in again"); }
  if (!res.ok) throw new Error(data.error || ("Error " + res.status));
  return data;
}

function logout(){ TOKEN=""; NAME=""; ME=""; ME_MASTER=false; ME_CAPS=[]; ME_RIGHTS={}; for(const k of ["ff_admin_token","ff_admin_name","ff_admin_user","ff_admin_master","ff_admin_wh","ff_admin_caps","ff_admin_rights"]) localStorage.removeItem(k); renderLogin(); }

// ---- Login ----
function renderLogin(){
  root.innerHTML = `
   <div class="login">
     <img src="/ff-logo.png" alt="FitFuel" style="width:120px;height:auto;display:block;margin:0 auto 12px" />
     <h2 style="margin-top:0">FitFuel Warehouse</h2>
     <p class="tag">Allocate &amp; dispatch orders</p>
     <label>Admin username</label>
     <input id="u" autocapitalize="none" autocorrect="off" inputmode="text" />
     <label>Password</label>
     <input id="p" type="password" autocomplete="current-password" />
     <button class="btn" id="go">Log in</button>
     <div class="err" id="err"></div>
   </div>`;
  const go = document.getElementById("go");
  const err = document.getElementById("err");
  async function submit(){
    err.textContent="";
    const username=document.getElementById("u").value.trim();
    const password=document.getElementById("p").value;
    if(!username||!password){ err.textContent="Enter username and password"; return; }
    go.disabled=true; go.textContent="Logging in…";
    try{
      const r = await api("/admin/login",{method:"POST",body:JSON.stringify({username,password})});
      TOKEN=r.token; NAME=r.name||username; ME=(r.username||username).toLowerCase(); ME_MASTER=!!r.isMaster;
      ME_CAPS=r.capabilities||[]; ME_RIGHTS=r.rights||{};
      localStorage.setItem("ff_admin_token",TOKEN); localStorage.setItem("ff_admin_name",NAME); localStorage.setItem("ff_admin_user",ME); localStorage.setItem("ff_admin_master", ME_MASTER?"1":"");
      localStorage.setItem("ff_admin_caps",JSON.stringify(ME_CAPS)); localStorage.setItem("ff_admin_rights",JSON.stringify(ME_RIGHTS));
      renderApp();
    }catch(e){ err.textContent=e.message; go.disabled=false; go.textContent="Log in"; }
  }
  go.onclick=submit;
  document.getElementById("p").addEventListener("keydown",e=>{ if(e.key==="Enter") submit(); });
}

// ---- App shell ----
// Tabs come from the signed-in person's rights (held at read is enough to see
// a section); the server refuses anything beyond their level regardless.
function renderApp(){
  const TABS = [
    ...(hasCap("allocate")      ? [{id:"allocate",    label:"1 · Allocate"}]    : []),
    ...(hasCap("fulfilment")    ? [{id:"fulfillment", label:"2 · Fulfillment"}] : []),
    ...(hasCap("deliveries")    ? [{id:"orders",      label:"Orders"}]          : []),
    ...(hasCap("returns")       ? [{id:"returns",     label:"Returns"}]         : []),
    ...(hasCap("summary")       ? [{id:"summary",     label:"Summary"}]         : []),
    ...(hasCap("activity")      ? [{id:"activity",    label:"Activity"}]        : []),
    ...(hasCap("drivers.manage")? [{id:"drivers",     label:"Drivers"}]         : []),
    ...(hasCap("staff.manage")  ? [{id:"people",      label:"People"}]          : []),
  ];
  root.innerHTML = `
   <header>
     <div><h1>${IS_WH_APP?"FitFuel Warehouse":"FitFuel Admin"}</h1><div class="sub">${esc(NAME)} · v${APP_VERSION}</div></div>
     <button id="logout">Log out</button>
   </header>
   <div class="wrap">
     <div class="tabs">
       ${TABS.map(t=>`<button data-tab="${t.id}" class="${TAB===t.id?"on":""}">${t.label}</button>`).join("")}
     </div>
     <div id="panel"><div class="loading">Loading…</div></div>
   </div>`;
  document.getElementById("logout").onclick=logout;
  if(!TABS.length){
    document.getElementById("panel").innerHTML =
      '<div class="empty">This account has no rights yet.<br>Ask an admin to grant them in People, then sign in again.</div>';
    return;
  }
  if(!TABS.some(t=>t.id===TAB)) TAB=TABS[0].id;   // never land on a hidden tab
  root.querySelectorAll(".tabs button").forEach(b=>{ b.onclick=()=>{ TAB=b.getAttribute("data-tab"); renderApp(); }; });
  root.querySelector(`.tabs button[data-tab="${TAB}"]`)?.classList.add("on");
  startGeo();
  if(TAB==="fulfillment") loadFulfillment();
  else if(TAB==="returns") loadReturns();
  else if(TAB==="orders") loadOrders();
  else if(TAB==="allocate") loadAllocate();
  else if(TAB==="drivers") loadDrivers();
  else if(TAB==="people") loadPeople();
  else if(TAB==="summary") loadSummary();
  else loadActivity();
}

// ---- Drivers ----
async function loadDrivers(){
  const canWrite = rightAtLeast("drivers.manage","write");
  const panel=document.getElementById("panel");
  panel.innerHTML = `
    ${canWrite?`<div class="card">
      <h3>Add driver</h3>
      <p class="hint">Driver logs in on the delivery app with this username + PIN.</p>
      <div class="row2">
        <div><label>Username</label><input id="nu" autocapitalize="none" autocorrect="off" /></div>
        <div><label>Full name</label><input id="nn" /></div>
        <div><label>PIN / password</label><input id="np" autocomplete="off" /></div>
      </div>
      <button class="btn" id="add">Add driver</button>
      <div class="err" id="adderr"></div>
    </div>`:""}
    <div class="card">
      <h3>Drivers</h3>
      <div class="scroll" id="dlist"><div class="loading">Loading…</div></div>
    </div>`;

  if(canWrite) document.getElementById("add").onclick=addDriver;

  try{
    const {drivers}=await api("/admin/drivers");
    DRIVERS=drivers;
    const list=document.getElementById("dlist");
    if(!drivers.length){ list.innerHTML='<div class="empty">No drivers yet — add one above.</div>'; return; }
    list.innerHTML = `<table><thead><tr>
        <th>Username</th><th>Name</th><th>Status</th><th>Added</th><th></th>
      </tr></thead><tbody>${drivers.map(driverRow).join("")}</tbody></table>`;
  }catch(e){ document.getElementById("dlist").innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}

function driverRow(d){
  const u=esc(d.username);
  const btns = [
    rightAtLeast("drivers.manage","write") ? `<button class="btn sm ghost" onclick="editDriver('${u}')">Edit</button>
      <button class="btn sm ghost" onclick="resetPin('${u}')">Reset PIN</button>` : "",
    rightAtLeast("drivers.manage","edit") ? `<button class="btn sm ${d.active?'danger':'ghost'}" onclick="toggleDriver('${u}',${d.active?'false':'true'})">${d.active?'Disable':'Enable'}</button>` : "",
  ].join("");
  return `<tr>
    <td><strong>${u}</strong></td>
    <td>${esc(d.name)}</td>
    <td>${d.active?'<span class="pill on">active</span>':'<span class="pill off">disabled</span>'}</td>
    <td>${esc((d.created_at||"").slice(0,10))}</td>
    <td class="actions">${btns||'<span class="hint">—</span>'}</td>
  </tr>`;
}

async function addDriver(){
  const err=document.getElementById("adderr"); err.textContent="";
  const username=document.getElementById("nu").value.trim();
  const name=document.getElementById("nn").value.trim();
  const pin=document.getElementById("np").value.trim();
  if(!username||!name||!pin){ err.textContent="Username, name and PIN are all required"; return; }
  const btn=document.getElementById("add"); btn.disabled=true; btn.textContent="Adding…";
  try{
    await api("/admin/drivers",{method:"POST",body:JSON.stringify({username,name,pin})});
    toast("✓ Driver added");
    loadDrivers();
  }catch(e){ err.textContent=e.message; btn.disabled=false; btn.textContent="Add driver"; }
}

async function editDriver(username){
  const d=DRIVERS.find(x=>x.username===username)||{username,name:""};
  const name=prompt("Driver's full name:", d.name||""); if(name===null) return;
  if(!name.trim()){ toast("Name cannot be empty"); return; }
  const nu=prompt("Username (login ID — lowercase letters, numbers, . _ -):", d.username); if(nu===null) return;
  if(!nu.trim()){ toast("Username cannot be empty"); return; }
  try{
    await api("/admin/driver-edit",{method:"POST",body:JSON.stringify({username, name:name.trim(), newUsername:nu.trim()})});
    toast("✓ Driver updated"); loadDrivers();
  }catch(e){ toast(e.message); }
}

async function resetPin(username){
  const pin=prompt("New PIN / password for "+username+":");
  if(pin==null) return;
  if(!pin.trim()){ toast("PIN cannot be empty"); return; }
  try{
    await api("/admin/reset",{method:"POST",body:JSON.stringify({username,pin:pin.trim()})});
    toast("✓ PIN reset for "+username);
  }catch(e){ toast(e.message); }
}

async function toggleDriver(username,active){
  const verb=active?"enable":"disable";
  if(!confirm("Are you sure you want to "+verb+" "+username+"?")) return;
  try{
    await api("/admin/toggle",{method:"POST",body:JSON.stringify({username,active})});
    toast("✓ "+username+" "+(active?"enabled":"disabled"));
    loadDrivers();
  }catch(e){ toast(e.message); }
}

// ---- Activity ----
async function loadActivity(){
  const panel=document.getElementById("panel");
  panel.innerHTML = `<div class="card">
      <h3>Delivery activity</h3>
      <p class="hint">Most recent 200 fulfilment / issue actions by drivers.</p>
      <div class="scroll" id="alist"><div class="loading">Loading…</div></div>
    </div>`;
  try{
    await ensureCarriers();
    const {activity}=await api("/admin/activity");
    const list=document.getElementById("alist");
    if(!activity.length){ list.innerHTML='<div class="empty">No activity logged yet.</div>'; return; }
    list.innerHTML = `<table><thead><tr>
        <th>When</th><th>Driver</th><th>Order</th><th>Status</th><th>Note</th>
      </tr></thead><tbody>${activity.map(activityRow).join("")}</tbody></table>`;
  }catch(e){ document.getElementById("alist").innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}

function activityRow(a){
  return `<tr>

// ---- People & rights (staff accounts, mirrors the wholesale app) ----
const CAP_LABELS = {
  "allocate":       "Allocate orders",
  "fulfilment":     "Fulfillment & dispatch",
  "deliveries":     "Delivery queue",
  "returns":        "Returns",
  "summary":        "End-of-day summary",
  "activity":       "Activity log",
  "drivers.manage": "Manage drivers",
  "staff.manage":   "Manage people & rights",
};
const LEVEL_LABELS = { read:"Read", write:"Write", edit:"Edit" };
let CAPS_LIST = Object.keys(CAP_LABELS);      // replaced by whatever the server
let LEVELS_LIST = ["read","write","edit"];    // sends, so new rows need no deploy

// Client mirror of the server's grant parsing (a bare "cap" is a legacy edit).
function grantLevel(permissions, cap){
  for (const g of permissions ?? []) {
    const [c, l] = String(g).split(":");
    if (c === cap) return LEVELS_LIST.includes(l) ? l : "edit";
  }
  return null;
}

function holdingsSummary(p){
  if (p.is_master) return "everything";
  const counts = {};
  for (const c of CAPS_LIST) { const l = grantLevel(p.permissions, c); if (l) counts[l] = (counts[l]||0)+1; }
  const bits = LEVELS_LIST.slice().reverse().filter(l=>counts[l]).map(l=>`${counts[l]} ${l}`);
  return bits.length ? bits.join(" · ") : "no rights yet";
}

async function loadPeople(){
  const canWrite = rightAtLeast("staff.manage","write");
  const canEdit  = rightAtLeast("staff.manage","edit");
  const panel=document.getElementById("panel");
  panel.innerHTML = `
    ${canWrite?`<div class="card">
      <h3>Add person</h3>
      <p class="hint">New people start with <b>no rights</b> — grade them in their card after adding.</p>
      <div class="row2">
        <div><label>Username</label><input id="au" autocapitalize="none" autocorrect="off" /></div>
        <div><label>Full name</label><input id="an" /></div>
        <div><label>Password</label><input id="ap" autocomplete="off" /></div>
      </div>
      <button class="btn" id="addadmin">Add person</button>
      <div class="err" id="aerr"></div>
    </div>`:""}
    <p class="hint" style="margin:0 0 10px"><b>Read</b> look only · <b>Write</b> the everyday work · <b>Edit</b> also undo what has already happened — disable an account, change someone's rights. Changes apply the next time the person signs in.</p>
    <div id="plist"><div class="loading">Loading…</div></div>`;
  if(canWrite) document.getElementById("addadmin").onclick=addPerson;

  try{
    const r=await api("/admin/admins");
    ADMINS=r.admins||[];
    if(Array.isArray(r.capabilities)&&r.capabilities.length) CAPS_LIST=r.capabilities;
    if(Array.isArray(r.levels)&&r.levels.length) LEVELS_LIST=r.levels;
    const plist=document.getElementById("plist");
    plist.innerHTML = ADMINS.map(p=>personCard(p,canEdit)).join("");
    // One delegated handler moves the segmented selection; Save posts it.
    plist.onclick=(e)=>{
      const b=e.target.closest(".lvl"); if(!b) return;
      b.parentElement.querySelectorAll(".lvl").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
    };
  }catch(e){ document.getElementById("plist").innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}

function personCard(p, canEdit){
  const u=esc(p.username);
  const isMe=(p.username||"").toLowerCase()===ME;
  const badges=(p.is_master?'<span class="pill master">master</span> ':'')
    +(isMe?'<span class="pill status">you</span> ':'')
    +(p.active?'':'<span class="pill off">disabled</span>');
  const matrix = (!p.is_master && canEdit) ? `
    <div class="capgrid">
      ${CAPS_LIST.map((c)=>{
        const held=grantLevel(p.permissions,c);
        return `<div class="caprow">
          <div class="capname">${esc(CAP_LABELS[c]??c)}</div>
          <div class="levels" data-for="${u}" data-cap="${esc(c)}">
            ${[["","None"],...LEVELS_LIST.map(l=>[l,LEVEL_LABELS[l]??l])].map(([v,label])=>
              `<button type="button" class="lvl ${held===(v||null)?"on":""}" data-level="${v}">${label}</button>`).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>
    <button class="btn sm" style="margin-top:12px" onclick="saveRights('${u}')">Save rights</button>` : "";
  const tools = canEdit ? `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center">
      ${(!p.is_master||isMe)?`<input id="pw-${u}" placeholder="new password" autocomplete="off" style="flex:1;min-width:150px;padding:9px 12px;font-size:14px" />
        <button class="btn sm ghost" onclick="resetAdmin('${u}')">Reset password</button>`:""}
      ${(p.is_master?isMe:true)?`<button class="btn sm ghost" onclick="editAdmin('${u}')">Edit</button>`:""}
      ${(!p.is_master&&!isMe)?`<button class="btn sm ${p.active?'danger':'ghost'}" onclick="toggleAdmin('${u}',${p.active?'false':'true'})">${p.active?'Disable':'Enable'}</button>`:""}
      ${(!p.is_master&&!isMe)?`<button class="btn sm danger" onclick="deleteAdmin('${u}')">Delete</button>`:""}
    </div>`:"";
  return `<details class="card pcard">
    <summary>
      <span><b>${esc(p.name)}</b> · <span class="hint">${u}</span> ${badges}</span>
      <span class="hint">${esc(holdingsSummary(p))}</span>
    </summary>
    ${matrix}${tools}
  </details>`;
}

async function saveRights(u){
  // Rebuilt from the DOM and replaced wholesale; "None" simply drops out.
  const permissions=[...document.querySelectorAll(`.levels[data-for="${u}"]`)]
    .map(g=>[g.dataset.cap, g.querySelector(".lvl.on")?.dataset.level])
    .filter(([,level])=>level)
    .map(([cap,level])=>`${cap}:${level}`);
  try{
    await api("/admin/rights",{method:"POST",body:JSON.stringify({username:u,permissions})});
    toast(`✓ ${u}: rights updated — they take effect next time ${u} signs in`);
    loadPeople();
  }catch(e){ toast(e.message); }
}

async function addPerson(){
  const err=document.getElementById("aerr"); err.textContent="";
  const username=document.getElementById("au").value.trim();
  const name=document.getElementById("an").value.trim();
  const password=document.getElementById("ap").value;
  if(!username||!name||!password){ err.textContent="Username, name and password are all required"; return; }
  const btn=document.getElementById("addadmin"); btn.disabled=true; btn.textContent="Adding…";
  try{
    await api("/admin/admins",{method:"POST",body:JSON.stringify({username,name,password,permissions:[]})});
    toast("✓ Added — now grade their rights");
    loadPeople();
  }catch(e){ err.textContent=e.message; btn.disabled=false; btn.textContent="Add person"; }
}

async function editAdmin(username){
  const a=ADMINS.find(x=>x.username===username)||{username,name:""};
  const name=prompt("Full name:", a.name||""); if(name===null) return;
  if(!name.trim()){ toast("Name cannot be empty"); return; }
  const nu=prompt("Username (login ID — lowercase letters, numbers, . _ -):", a.username); if(nu===null) return;
  if(!nu.trim()){ toast("Username cannot be empty"); return; }
  try{
    await api("/admin/admin-edit",{method:"POST",body:JSON.stringify({username, name:name.trim(), newUsername:nu.trim()})});
    toast("✓ Updated");
    if(username===ME){ ME=nu.trim().toLowerCase(); localStorage.setItem("ff_admin_user",ME); }
    loadPeople();
  }catch(e){ toast(e.message); }
}

async function resetAdmin(username){
  const inp=document.getElementById("pw-"+username);
  const password=(inp?inp.value:"").trim();
  if(!password){ toast("Type the new password in the box first"); return; }
  try{
    await api("/admin/admin-reset",{method:"POST",body:JSON.stringify({username,password})});
    if(inp) inp.value="";
    toast("✓ Password reset for "+username);
  }catch(e){ toast(e.message); }
}

async function toggleAdmin(username,active){
  const verb=active?"enable":"disable";
  if(!confirm("Are you sure you want to "+verb+" "+username+"?")) return;
  try{
    await api("/admin/admin-toggle",{method:"POST",body:JSON.stringify({username,active})});
    toast("✓ "+username+" "+(active?"enabled":"disabled"));
    loadPeople();
  }catch(e){ toast(e.message); }
}

async function deleteAdmin(username){
  if(!confirm("Delete "+username+"? This cannot be undone.")) return;
  try{
    await api("/admin/admin-delete",{method:"POST",body:JSON.stringify({username})});
    toast("✓ Deleted "+username);
    loadPeople();
  }catch(e){ toast(e.message); }
}

// ---- Fulfillment (warehouse: verify the pick, then dispatch) ----
async function loadFulfillment(){
  document.getElementById("panel").innerHTML=`
    <p class="hint" style="margin:0 0 12px">Check the items, then press <b>✓ Fulfilled</b> to dispatch — this fulfils the order in Shopify and WhatsApps the customer that it's on the way.<br>
    For orders going out with a driver who isn't on the app, press <b>📲 Notify shipped</b> instead (message only — you fulfil it in Shopify later, and the customer is told "delivered" automatically).</p>
    <div id="flist"><div class="loading">Loading orders…</div></div>`;
  await loadFulfillList();
}

let FORDERS={};
async function loadFulfillList(){
  const list=document.getElementById("flist");
  try{
    await ensureCarriers();
    const {orders}=await api("/orders?scope=unfulfilled");
    FORDERS=Object.fromEntries(orders.map(o=>[o.id,o]));
    if(!orders.length){ list.innerHTML='<div class="empty">🎉 Nothing waiting to be fulfilled.<br><br><button class="btn ghost" style="max-width:200px;margin:0 auto" onclick="loadFulfillList()">Refresh</button></div>'; return; }
    // Group driver-wise so the warehouse can pick one driver's run at a time.
    const groups={};
    for(const o of orders){ const k=o.assignedTo||"__none"; (groups[k]=groups[k]||[]).push(o); }
    const keys=Object.keys(groups).sort((a,b)=> a==="__none"?1 : b==="__none"?-1 : a.localeCompare(b));
    list.innerHTML = keys.map(k=>{
      const n=groups[k].length;
      const label = k==="__none"
        ? `⚠️ Not allocated yet <span class="cnt">· ${n} order${n>1?"s":""} — allocate in the Allocate tab</span>`
        : `${esc(assigneeLabel(k))} <span class="cnt">· ${n} order${n>1?"s":""}</span>`;
      // Unallocated stays open (it needs action); driver runs start collapsed.
      return `<details class="grp${k==="__none"?" warn":""}"${k==="__none"?" open":""}>
        <summary>${label}</summary>
        ${groups[k].map(fcard).join("")}
      </details>`;
    }).join("") + '<button class="btn ghost" onclick="loadFulfillList()">Refresh</button>';
  }catch(e){ list.innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}

function fcard(o){
  const mapsHref=o.address?"https://maps.google.com/?q="+encodeURIComponent(o.address):"";
  const isCarrier=isCarrierAssignee(o.assignedTo);
  // Carrier orders read left-to-right as the physical flow: book the shipment
  // first (creates the AWB — no fulfilment, no customer message), then hand over.
  // "Courier collected" stays greyed until the booking exists.
  const actionsHtml = isCarrier
    ? `${o.bookedAwb
        ? `<button class="btn ghost" id="fl-${esc(o.id)}" onclick="printLabel('${esc(o.id)}')">🖨 Label</button>`
        : `<button class="btn" id="fb-${esc(o.id)}" onclick="bookCarrier('${esc(o.id)}')">📦 Book shipment</button>`}
      <button class="btn${o.bookedAwb?"":" ghost"}" id="ff-${esc(o.id)}" ${o.bookedAwb
        ? `onclick="fulfilOrder('${esc(o.id)}')"`
        : 'disabled title="Book the shipment with TFM first"'}>✓ Courier collected</button>`
    : `${o.assignedTo
        ? `<button class="btn" id="ff-${esc(o.id)}" onclick="fulfilOrder('${esc(o.id)}')">✓ Fulfilled</button>`
        : `<button class="btn" disabled title="Allocate this order to a driver or courier first">Allocate first</button>`}
      <button class="btn ghost" id="fn-${esc(o.id)}" onclick="notifyShipped('${esc(o.id)}')">📲 Notify shipped</button>`;
  return `
  <div class="ocard" id="fcard-${esc(o.id)}">
    <div class="otop"><div class="onum">${esc(o.name)}</div><div class="ototal">${esc(o.total)}</div></div>
    <div class="owho">${esc(o.customerName)}${o.cod?' <span class="pill status">COD</span>':''}${o.assignedTo?` <span class="pill on">${esc(assigneeLabel(o.assignedTo))}</span>`:' <span class="pill off">unallocated</span>'}${o.bookedAwb?` <span class="pill status">AWB ${esc(o.bookedAwb)}</span>`:''}</div>
    ${o.address?`<a class="orow" href="${esc(mapsHref)}" target="_blank">📍 ${esc(o.address)}</a>`:""}
    ${o.phone?`<a class="orow" href="tel:${esc(o.phone)}">📞 ${esc(o.phone)}</a>`:""}
    ${o.note?`<div class="onote">📝 ${esc(o.note)}</div>`:""}
    <div class="oitems">${o.items.map(i=>`<div><span>${esc(i.title)}${i.variant?` <b style="color:var(--green-d)">· ${esc(i.variant)}</b>`:""}</span><span>×${esc(i.quantity)}</span></div>`).join("")}</div>
    ${rightAtLeast("fulfilment") ? `<div class="oactions">${actionsHtml}</div>` : ""}
  </div>`;
}

async function fulfilOrder(id){
  const o=FORDERS[id]||{};
  const isCarrier=isCarrierAssignee(o.assignedTo);
  const q=isCarrier
    ? "Has the courier collected this order? This fulfils it in Shopify and tells the customer it's on the way."
    : "Fulfil this order in Shopify and tell the customer it's on the way?";
  if(!confirm(q)) return;
  const btn=document.getElementById("ff-"+id);
  if(btn){ if(btn.disabled) return; btn.disabled=true; btn.textContent="Working…"; }
  const el=document.getElementById("fcard-"+id); if(el) el.classList.add("fade");
  try{
    const r=await api("/admin/fulfill",{method:"POST",body:JSON.stringify({orderGid:id})});
    const ok=r&&r.awb ? "✓ Dispatched — AWB "+r.awb : "✓ Fulfilled";
    toast(r&&r.otwWarning ? (ok+" — customer not messaged: "+r.otwWarning) : ok+" & customer notified");
    if(el){ el.style.transition="opacity .3s"; el.style.opacity="0"; setTimeout(()=>el.remove(),300); }
  }catch(e){
    if(el) el.classList.remove("fade");
    if(btn){ btn.disabled=false; btn.textContent=isCarrier?"✓ Courier collected":"✓ Fulfilled"; }
    toast(e.message);
  }
}

async function notifyShipped(id){
  const btn=document.getElementById("fn-"+id);
  if(btn){ if(btn.disabled) return; btn.disabled=true; btn.textContent="Sending…"; }
  try{
    const r=await api("/admin/notify-shipped",{method:"POST",body:JSON.stringify({orderGid:id})});
    if(r&&r.ok){ if(btn) btn.textContent="✓ Customer notified"; toast("📲 Customer notified"); }
    else { if(btn){ btn.disabled=false; btn.textContent="📲 Notify shipped"; } toast((r&&r.error)||"Couldn't notify"); }
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent="📲 Notify shipped"; } toast(e.message); }
}

// Book the courier shipment (AWB) while packing — no fulfilment, no customer message.
async function bookCarrier(id){
  const btn=document.getElementById("fb-"+id);
  if(btn){ if(btn.disabled) return; btn.disabled=true; btn.textContent="Booking…"; }
  try{
    const r=await api("/admin/carrier-book",{method:"POST",body:JSON.stringify({orderGid:id})});
    toast("📦 Booked — AWB "+r.awb);
    loadFulfillList();
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent="📦 Book shipment"; }
    toast(e.message);
  }
}

// Fetch the courier label PDF and open/download it for printing.
async function printLabel(id){
  const btn=document.getElementById("fl-"+id);
  if(btn){ if(btn.disabled) return; btn.disabled=true; btn.textContent="Fetching…"; }
  try{
    const r=await api("/admin/carrier-label",{method:"POST",body:JSON.stringify({orderGid:id})});
    const bytes=Uint8Array.from(atob(r.pdf),c=>c.charCodeAt(0));
    const url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));
    const w=window.open(url,"_blank");
    if(!w){ const a=document.createElement("a"); a.href=url; a.download="tfm-label-"+(r.awb||id)+".pdf"; a.click(); }
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){ toast(e.message); }
  finally{ if(btn){ btn.disabled=false; btn.textContent="🖨 Label"; } }
}

window.loadFulfillList=loadFulfillList; window.fulfilOrder=fulfilOrder; window.notifyShipped=notifyShipped;
window.bookCarrier=bookCarrier; window.printLabel=printLabel;

      <div class="thumbs" id="othumbs-${esc(o.id)}" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"></div>
      ${o.cod ? `<div class="cash">
        <label><input type="checkbox" id="ocash-${esc(o.id)}" checked /> Cash received (COD)</label>
        <input type="number" inputmode="decimal" step="0.01" id="ocamt-${esc(o.id)}" value="${esc(o.amount)}" />
        <div style="font-size:12px;color:#000000;margin-top:6px">Enter the actual cash collected — less than the total records a partial payment.</div>
      </div>` : ""}
      <div class="geo" id="ogeo-${esc(o.id)}"></div>
      <button class="btn confirm" id="ocfm-${esc(o.id)}" onclick="confirmOFulfill('${esc(o.id)}')">Confirm delivery</button>
    </div>
    <div class="oissues" id="oiss-${esc(o.id)}">
      <div class="opt">
        <button onclick="oreportIssue('${esc(o.id)}','not_home')">Not home</button>
        <button onclick="oreportIssue('${esc(o.id)}','rescheduled')">Reschedule</button>
        <button onclick="oreportIssue('${esc(o.id)}','refused')">Refused</button>
      </div>
      <textarea id="onote-${esc(o.id)}" placeholder="Optional note (e.g. left with neighbour)"></textarea>
    </div>
  </div>`;
}

function otoggleIssue(id){ document.getElementById("oiss-"+id).classList.toggle("open"); }

// ---- Geolocation + proof-photo fulfil (mirrors the driver app) ----
let CURRENT_POS=null, GEO_ON=false;
function startGeo(){
  if(GEO_ON || !("geolocation" in navigator)) return;
  GEO_ON=true;
  navigator.geolocation.watchPosition(
    p=>{ CURRENT_POS={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}; },
    ()=>{},
    { enableHighAccuracy:true, maximumAge:30000, timeout:20000 }
  );
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) startGeo(); });

const OPHOTOS={};   // id -> array of data URLs (max 3)
const MAX_PHOTOS=3;
function renderOThumbs(id){
  const wrap=document.getElementById("othumbs-"+id); if(!wrap) return;
  const arr=OPHOTOS[id]||[];
  wrap.innerHTML=arr.map((src,i)=>`<div style="position:relative">
      <img src="${src}" style="width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)" />
      <button type="button" onclick="removeOPhoto('${id}',${i})" style="position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:none;background:var(--red);color:#fff;font-size:13px;line-height:1">✕</button>
    </div>`).join("");
  const inp=document.getElementById("ophoto-"+id);
  if(inp) inp.style.display = arr.length>=MAX_PHOTOS ? "none" : "block";
}
function removeOPhoto(id,i){ if(OPHOTOS[id]){ OPHOTOS[id].splice(i,1); renderOThumbs(id); } }
function downscale(file,maxDim,quality){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>=h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      resolve(c.toDataURL("image/jpeg",quality));
    };
    img.onerror=reject;
    img.src=URL.createObjectURL(file);
  });
}
function ogeoHint(el){
  if(!el) return;
  if(CURRENT_POS){ el.className="geo"; el.textContent="📍 Location ready (±"+Math.round(CURRENT_POS.acc||0)+"m)"; }
  else { el.className="geo off"; el.textContent="📍 Location unavailable — will record without GPS"; }
}
function otoggleFulfill(id){
  const el=document.getElementById("offl-"+id);
  el.classList.toggle("open");
  if(el.classList.contains("open")){ startGeo(); ogeoHint(document.getElementById("ogeo-"+id)); }
}
async function onOPhoto(id){
  const inp=document.getElementById("ophoto-"+id);
  const f=(inp.files||[])[0];
  if(!f) return;
  if((OPHOTOS[id]||[]).length>=MAX_PHOTOS){ toast("Up to 3 photos"); inp.value=""; return; }
  try{
    const dataUrl=await downscale(f,1280,0.6);
    (OPHOTOS[id]=OPHOTOS[id]||[]).push(dataUrl);
    renderOThumbs(id);
  }catch{ toast("Couldn't read that photo"); }
  finally{ inp.value=""; }
}
async function confirmOFulfill(id){
  if(!(OPHOTOS[id]&&OPHOTOS[id].length)){ toast("Please add at least one proof photo"); return; }
  const btn=document.getElementById("ocfm-"+id);
  if(btn){ if(btn.disabled) return; btn.disabled=true; btn.textContent="Working…"; }
  const codCheck=document.getElementById("ocash-"+id);
  const cashCollected=codCheck?codCheck.checked:false;
  const amtEl=document.getElementById("ocamt-"+id);
  const cashAmount=cashCollected&&amtEl?Number(amtEl.value||0):null;
  const el=document.getElementById("ocard-"+id); el.classList.add("fade");
  try{
    const r = await api("/deliver",{method:"POST",body:JSON.stringify({
      orderGid:id, photos:OPHOTOS[id], cashCollected, cashAmount,
      lat:CURRENT_POS?CURRENT_POS.lat:null, lng:CURRENT_POS?CURRENT_POS.lng:null, accuracy:CURRENT_POS?CURRENT_POS.acc:null
    })});
    const warns=[];
    if(r&&r.paymentWarning) warns.push("payment not marked: "+r.paymentWarning);
    if(r&&r.deliveryWarning) warns.push("not marked delivered: "+r.deliveryWarning);
    toast(warns.length ? ("✓ Delivered — "+warns.join(" · ")) : "✓ Delivered");
    delete OPHOTOS[id];
    el.style.transition="opacity .3s"; el.style.opacity="0"; setTimeout(()=>el.remove(),300);
  }catch(e){ el.classList.remove("fade"); if(btn){ btn.disabled=false; btn.textContent="Confirm delivery"; } toast(e.message); }
}

async function oreportIssue(id,status){
  const note=(document.getElementById("onote-"+id)||{}).value||"";
  const o=OORDERS[id]||{};
  const el=document.getElementById("ocard-"+id); el.classList.add("fade");
  try{
    await api("/report-issue",{method:"POST",body:JSON.stringify({orderGid:id,status,note,customerPhone:o.phone||"",orderName:o.name||""})});
    toast("Saved: "+status.replace("_"," "));
    el.style.transition="opacity .3s"; el.style.opacity="0"; setTimeout(()=>el.remove(),300);
  }catch(e){ el.classList.remove("fade"); toast(e.message); }
}

async function onotifyOtw(id){
  const o=OORDERS[id]; if(!o) return;
  if(!o.phone){ toast("No phone number on this order"); return; }
  const btn=document.getElementById("ootw-"+id);
  if(btn){ btn.disabled=true; btn.textContent="Sending…"; }
  try{
    const r=await api("/notify",{method:"POST",body:JSON.stringify({kind:"otw",orderGid:id})});
    if(r&&r.skipped){ toast("WhatsApp isn't set up yet"); if(btn){ btn.disabled=false; btn.textContent="📲 On my way — notify customer"; } return; }
    if(o) o.otwSent=true;
    if(btn){ btn.textContent="✓ Customer notified"; btn.disabled=true; }
    toast(r&&r.alreadySent ? "Already notified" : "📲 Customer notified");
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent="📲 On my way — notify customer"; } toast(e.message); }
}
// Master-only: re-enable "On my way" for an order.
async function resetOtw(id){
  if(!confirm("Allow 'On my way' to be sent again for this order?")) return;
  try{ await api("/admin/reset-otw",{method:"POST",body:JSON.stringify({orderGid:id})}); toast("↺ Reset — can notify again"); loadOrderList(); }
  catch(e){ toast(e.message); }
}

window.loadOrderList=loadOrderList; window.otoggleIssue=otoggleIssue; window.oreportIssue=oreportIssue;
window.otoggleFulfill=otoggleFulfill; window.onOPhoto=onOPhoto; window.confirmOFulfill=confirmOFulfill; window.removeOPhoto=removeOPhoto; window.onotifyOtw=onotifyOtw; window.resetOtw=resetOtw;

// ---- Summary (end-of-day, per driver) ----
function todayDubai(){ return new Date(Date.now()+4*3600*1000).toISOString().slice(0,10); }
let SUMMARY_DATE = todayDubai();

async function loadSummary(){
  const panel=document.getElementById("panel");
  panel.innerHTML=`
    <div class="sumhead">
      <span class="hint">Day (Asia/Dubai):</span>
      <input type="date" id="sumdate" value="${esc(SUMMARY_DATE)}" max="${esc(todayDubai())}" />
    </div>
    <div id="sumbody"><div class="loading">Loading…</div></div>`;
  document.getElementById("sumdate").onchange=(e)=>{ SUMMARY_DATE=e.target.value||todayDubai(); loadSummary(); };
  try{
    await ensureCarriers();
    const {summary}=await api("/admin/summary?date="+encodeURIComponent(SUMMARY_DATE));
    const body=document.getElementById("sumbody");
    if(!summary.length){ body.innerHTML='<div class="empty">No deliveries on this date.</div>'; return; }
    body.innerHTML=summary.map(drvCard).join("");
  }catch(e){ document.getElementById("sumbody").innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}

function fmtMoney(n){ return (Math.round(Number(n||0)*100)/100).toFixed(2); }

function drvCard(d){
  return `<div class="card drvcard">
    <div class="drvtop">
      <div class="nm">${esc(displayActor(d.driver))}</div>
      <div class="stat"><b>${esc(d.completed)}</b> delivered · cash collected <span class="cashbig">${esc(fmtMoney(d.cashTotal))}</span></div>
    </div>
    <div>${d.items.map(delivRow).join("")}</div>
  </div>`;
}

function delivRow(it){
  const geo=(it.lat!=null&&it.lng!=null)
    ? `<a href="https://maps.google.com/?q=${esc(it.lat)},${esc(it.lng)}" target="_blank">📍 GPS</a>`
    : '<span class="hint">no GPS</span>';
  const cash=it.cash_collected?` · 💵 ${esc(fmtMoney(it.cash_amount))}`:"";
  const urls=it.photoUrls||(it.photoUrl?[it.photoUrl]:[]);
  const img=urls.length
    ? urls.map(u=>`<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" alt="proof" /></a>`).join("")
    : `<img alt="no photo" />`;
  return `<div class="deliv">
    ${img}
    <div class="meta">
      <div class="ttl">${esc(it.order_name||"—")} <span class="pill status">${esc((it.status||"").replace("_"," "))}</span></div>
      <div class="hint">${esc(fmtTime(it.created_at))} · ${geo}${cash}</div>
      ${it.note?`<div class="hint">📝 ${esc(it.note)}</div>`:""}
    </div>
  </div>`;
}

// ---- Allocate (assign orders to drivers) ----
// The customer-typed "city" is messy (districts, spellings). Snap each order to
// one of the 7 UAE emirates by scanning all its address text.
const EMIRATE_ORDER=["Dubai","Abu Dhabi","Al Ain","Sharjah","Ajman","Umm Al Quwain","Ras Al Khaimah","Fujairah","Other"];
function emirateOf(o){
  const city=((o.city||"")+" "+(o.province||"")).toLowerCase();          // administrative fields
  const full=(city+" "+(o.area||"")+" "+(o.address||"")).toLowerCase();
  if(/dubai|\bdxb\b/.test(full)) return "Dubai";
  // Al Ain is part of Abu Dhabi emirate but a separate delivery zone. Detect from the
  // CITY field (reliable) or distinctive Al Ain districts — NOT "Al Ain" in a street/
  // building name (e.g. "Al Ain Tower" is actually in Abu Dhabi city).
  if(/\bal[\s-]*ain\b|alain/.test(city) || /al\s*jimi|al\s*muwaiji|\bzakher\b|falaj\s*hazz|al\s*mutarad|al\s*towayya|al\s*jahili|al\s*qattara|al\s*yahar|al\s*maqam/.test(full)) return "Al Ain";
  if(/abu\s*dhabi|abudhabi|\bauh\b|reem island|yas island|khalifa city|mussafah/.test(full)) return "Abu Dhabi";
  if(/sharjah|\bshj\b/.test(full)) return "Sharjah";
  if(/ajman/.test(full)) return "Ajman";
  if(/umm[\s-]*al[\s-]*qu?[a-z]+|\buaq\b/.test(full)) return "Umm Al Quwain";
  if(/ras[\s-]*al[\s-]*khaimah|\brak\b|alrams/.test(full)) return "Ras Al Khaimah";
  if(/fuja[ie]rah/.test(full)) return "Fujairah";
  return "Other";
}

async function loadAllocate(){
  const panel=document.getElementById("panel");
  panel.innerHTML='<div class="loading" id="alloc">Loading orders…</div>';
  try{
    const [dRes,oRes]=await Promise.all([api("/admin/drivers"), api("/orders?scope=unfulfilled"), ensureCarriers()]);
    const active=(dRes.drivers||[]).filter(d=>d.active);
    const orders=oRes.orders||[];
    const el=document.getElementById("alloc");
    if(!active.length && !CARRIERS.length){ el.outerHTML='<div class="empty" id="alloc">Add an active driver first (Drivers tab).</div>'; return; }
    if(!orders.length){ el.outerHTML='<div class="empty" id="alloc">No open orders to allocate.</div>'; return; }
    // Group by the 7 emirates so a driver can be assigned to a whole zone.
    orders.forEach(o=>{ o._em=emirateOf(o); });
    orders.sort((a,b)=> EMIRATE_ORDER.indexOf(a._em)-EMIRATE_ORDER.indexOf(b._em) || (a.city||"").localeCompare(b.city||"") || a.name.localeCompare(b.name));
    // Couriers (3PL, e.g. TFM Express) allocate like drivers but have no logins:
    // dispatch books the shipment with them instead of a driver handover.
    const opts=(sel)=>'<option value="">— Unassigned —</option>'
      +(CARRIERS.length?'<optgroup label="Couriers">'+CARRIERS.map(c=>`<option value="carrier:${esc(c.code)}" ${sel==="carrier:"+c.code?'selected':''}>🚛 ${esc(c.name)}</option>`).join("")+'</optgroup>':'')
      +'<optgroup label="Drivers">'+active.map(d=>`<option value="${esc(d.username)}" ${sel===d.username?'selected':''}>${esc(d.name)} (${esc(d.username)})</option>`).join("")+'</optgroup>';
    const loc=(o)=>{
      const cityBits=[o.city, (o.province&&o.province!==o.city)?o.province:""].filter(Boolean).join(", ");
      return (cityBits||o.area)?`<div style="margin-top:9px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center">
        ${cityBits?`<span class="pill status">📍 ${esc(cityBits)}</span>`:""}
        ${o.area?`<span class="hint" style="font-size:13.5px">${esc(o.area)}</span>`:""}
      </div>`:"";
    };
    let lastEm=null;
    el.outerHTML='<div id="alloc">'+orders.map(o=>{
      const header=(o._em!==lastEm)?`<div class="hint" style="margin:18px 0 8px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--green-d)">📍 ${esc(o._em)} <span style="opacity:.6;font-weight:600">· ${orders.filter(x=>x._em===o._em).length}</span></div>`:"";
      lastEm=o._em;
      return header+`
      <div class="card">
        <div class="drvtop">
          <div><div class="nm">${esc(o.name)}</div><div class="hint">${esc(o.customerName||"")}</div></div>
          <span class="pill ${o.assignedTo?'on':'off'}" id="apill-${esc(o.id)}">${o.assignedTo?esc(assigneeLabel(o.assignedTo)):'unassigned'}</span>
        </div>
        ${loc(o)}
        <label class="hint" style="display:block;margin-top:10px">Allocate to driver or courier</label>
        <select ${rightAtLeast("allocate")?`onchange="assignOrder('${esc(o.id)}', this.value)"`:"disabled"}>${opts(o.assignedTo)}</select>
      </div>`;
    }).join("")+'</div>';
  }catch(e){ const el=document.getElementById("alloc"); if(el) el.outerHTML='<div class="empty" id="alloc">'+esc(e.message)+'</div>'; }
}

async function assignOrder(orderGid, driverUsername){
  try{
    const r=await api("/admin/assign",{method:"POST",body:JSON.stringify({orderGid,driverUsername})});
    const pill=document.getElementById("apill-"+orderGid);
    if(pill){ pill.className="pill "+(r.assignedTo?"on":"off"); pill.textContent=r.assignedTo?assigneeLabel(r.assignedTo):"unassigned"; }
    let msg=r.assignedTo?("✓ Allocated to "+assigneeLabel(r.assignedTo)):"✓ Unassigned";
    // Moving a pre-booked order away from its courier cancels the shipment; surface
    // the rare case where that revoke didn't go through.
    if(r.bookingWarning) msg+=" — ⚠️ "+r.bookingWarning;
    toast(msg);
  }catch(e){ toast(e.message); }
}
window.assignOrder=assignOrder;

// ---- boot ----
if("serviceWorker" in navigator){ navigator.serviceWorker.register("./sw.js").catch(()=>{}); }
if(TOKEN) renderApp(); else renderLogin();
</script>
